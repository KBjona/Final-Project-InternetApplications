<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product:----</title>
    <link rel="stylesheet" href="/product/product_edit.css">
</head>

<body>
    <div class="product-container">
        <div id="editing-section">
            <div id="edit-title-div">
                <span id="edit-title"><b><u>Editing Section:</u></b></span>
            </div>
            <form id="form">
                <div class="field-group">
                    <label for="product-name">Product Name:</label>
                    <input type="text" name="product-name" id="product-name" placeholder="Enter product name" value="----">
                </div>
                <div class="field-group">
                    <label for="product-description">Product Description:</label>
                    <textarea name="product-description" id="product-description" placeholder="Enter product description"></textarea>
                </div>
                <div class="field-group">
                    <label for="product-price">Product Price in dollars (max $1000):</label>
                    <input type="text" name="product-price" id="product-price" min = "0" max = "1000" placeholder="Enter product price" value="0.00">
                </div>
                <div class="field-group">
                    <label for="product-stock">Product Stock :</label>
                    <input type="number" name="product-stock" id="product-stock" min="0" max="1000000000" placeholder="Enter product quantity" value="0">
                </div>
                <div class="field-group">
                    <label for="product-discount">Product Discount in percentages:</label>
                    <input type="number" name="product-discount" id="product-discount" min="0" max="100" placeholder="Enter product discount percentage" value="0">
                </div>
                
                <div class="field-group">
                    <div class="file-upload">
                        <button type="button" onclick="upload_file('product-image')">Upload product image(max 1MB)</button>
                        <input type="file" name="product-image" id="product-image" class="hidden" accept="image/*">
                    </div>
                    <div class="file-upload">
                        <button type="button" onclick="upload_file('product-video')">Upload product video(max 8MB)</button>
                        <input type="file" name="product-video" id="product-video" class="hidden" accept="video/*">
                    </div>
                </div>

                <div class="color-pickers">
                    <div class="field-group color-field">
                        <label for="background-firstly-color">Background Firstly Color</label>
                        <input type="color" name="background-firstly-color" id="background-firstly-color" value="#ffffff">
                    </div>
                    <div class="field-group color-field">
                        <label for="background-secondary-color">Background Secondary Color</label>
                        <input type="color" name="background-secondary-color" id="background-secondary-color" value="#cccccc">
                    </div>
                    <div class="field-group color-field">
                        <label for="name-color">Name Text Color</label>
                        <input type="color" name="name-color" id="name-color" placeholder="Enter name text color" value="#000000">
                    </div>
                    <div class="field-group color-field">
                        <label for="description-color">Description Text Color</label>
                        <input type="color" name="description-color" id="description-color" placeholder="Enter description text color" value="#808080">
                    </div>
                </div>

                <button type="submit">Save Product</button>

            </form>
        </div>

    </div>
    <script src="/product/product_edit.js"></script>
</body>
</html>
