<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
 <!-- TODO: add nav and footer tags-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/mainMenu/mainMenu.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <title>My Shop</title>
</head>

<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar-container">
    <div class="user-profile">
      <button class="btn btn-outline-light btn-sm" onclick="openSettings()">Account settings</button>
    </div>
    <div class="search-bar-container">
      <input type="text" id="store-search" class="form-control" placeholder="Search products...">
    </div>
    <div class="nav-right">
      <h2 class="store-logo">My Shop</h2>
      <button id="open-cart-btn" class="btn btn-outline-light position-relative btn-sm px-3" onclick="toggleCart()">
        🛒 Cart
        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </button>
    </div>
  </nav>

  <!-- Main Storefront -->
  <main class="store-layout">

    <aside class="sidebar-filters">
      <h3>Filters</h3>
      
      <div class="filter-group">
        <label for="maxPrice" class="form-label">Price Range</label>
        <div class="slider-wrapper">
          <span class="slider-label">$0</span>
          <input type="range" class="form-range" id="maxPrice" min="0" max="1000" value="500">
          <span class="slider-label">$1000</span> 
        </div>
        <div>
          <span id="priceVal" class="filter-val-badge">0$ - 500$</span>    
        </div>
      </div>

      <div class="filter-group">
        <label for="minDiscount" class="form-label">Minimum Discount</label>
        <div class="slider-wrapper">
          <span class="slider-label">0%</span>
          <input type="range" class="form-range" id="minDiscount" min="0" max="100" value="10">
          <span class="slider-label">100%</span> 
        </div>
        <div>
          <span id="discountVal" class="filter-val-badge">10% - 100%</span>    
        </div>
      </div>

      <div class="filter-group">
        <h5>Reviews</h5>
        <div class="form-check">
          <input class="form-check-input" type="radio" id="stars5" name="stars">
          <label class="form-check-label" for="stars5">5★ </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" id="stars4" name="stars">
          <label class="form-check-label" for="stars4">4★ & higher</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" id="stars3" name="stars">
          <label class="form-check-label" for="stars3">3★ & higher</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" id="stars2" name="stars">
          <label class="form-check-label" for="stars2">2★ & higher</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" id="stars1" name="stars">
          <label class="form-check-label" for="stars1">1★ & higher</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" id="all" name="stars">
          <label class="form-check-label" for="all">All</label>
        </div>
      </div>
      <div class="filter-group">
        <h5>Weather</h5>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="ownWeather">
          <label class="form-check-label" for="ownWeather">Own weather </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="Spring">
          <label class="form-check-label" for="Spring">Warm</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="Summer">
          <label class="form-check-label" for="Summer">Hot</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="Fall">
          <label class="form-check-label" for="Fall">Cool</label>
        </div>
        <div>
          <input class="form-check-input" type="checkbox" id="Winter">
          <label class="form-check-label" for="Winter">Cold</label>
        </div>
      </div>
      <div class="filter-group">
        <h5>Product owner</h5>
          <input class="form-check-input" name="productOwner" type="radio" id="mineOnly">
          <label class="form-check-label" for="mineOnly">Mine Only</label> <br>
         <input class="form-check-input" name="productOwner" type="radio" id="followersOnly">
         <label class="form-check-label" for="followersOnly">Followed Only</label> <br>
          <input class="form-check-input" name="productOwner" type="radio" id="AllProductsOwner">
          <label class="form-check-label" for="AllProductsOwner">All Products</label> <br>
      </div>
    </aside>

    <section class="products-container">
      <div class="product-grid" id="product-grid"></div>
      <div class="load-more-wrap">
        <button id="load-more-btn" class="btn btn-outline-light load-more-btn">Load More</button>
      </div>
    </section>

  </main>

  <!-- Cart Pop-up Overlay -->
  <div id="cart-backdrop" class="cart-backdrop" onclick="toggleCart()"></div>

  <aside id="cart-popup" class="cart-popup">
    <header class="cart-header">
      <h4>Shopping Cart</h4>
      <button type="button" class="btn-close btn-close-white" onclick="toggleCart()"></button>
    </header>
    <div class="cart-body" id="cart-body">
      <p class="text-muted text-center my-4" id="empty-cart-msg">Your cart is empty.</p>
      <ul id="cart-items-list" class="list-group list-group-flush"></ul>
    </div>
    <footer class="cart-footer">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <strong>Total:</strong>
        <span id="cart-total" class="fs-5 fw-bold text-success">$0.00</span>
      </div>
      <button class="btn btn-success w-100 py-2" onclick="window.location.href='/cart'" >Checkout</button>
    </footer>
  </aside>

    <div id="Account-modal" class="Account-modal hidden"> <!-- The account settings modal, the menu with the account settings area and its interfaces-->
      <div class="Account-content">
        <button id="close-Account-btn" onclick="closeSettings()">X</button> <!-- the exit account settings modal button -->
        <h3>Account settings</h3> <br>
            <form>
                <label for="fname" id="fnameL" class="form-label">First name</label>
                <input type="text" id="fname" class="form-control accountInfo"></input>

                <label for="lname" id="lnameL" class="form-label">Last name</label>
                <input type="text" id="lname" class="accountInfo form-control"></input>

                <label for="email" id="emailL" class="form-label">Email address</label>
                <input type="text" id="email" class="accountInfo form-control" disabled value="jona10112010@gmail.com"></input>

                <label for="bday" id="bdayL" class="form-label">Date of birth</label>
                <input type="date" id="bday" class="form-control">

                <label for="long" id="longL" class="form-label">Longitude</label>
                <input type="number" step="0.000001" id="long" class="form-control">

                <label for="lat" id="latL" class="form-label">Latitude</label>
                <input type="number" step="0.000001" id="lat" class="form-control">

                <label for="pass" id="passL" class="form-label">Password</label>
                <input type="password" id="pass" class="accountInfo form-control">

                <div class="mt-4 d-flex justify-content-between align-items-center">
                <button type="button" id="delete-account-btn" class="btn btn-outline-danger btn-sm"> Delete Account </button>
                <button type="submit" id="update-account-btn" class="btn-update-data">
                  <span>Save Changes</span>
                </button>
                </div>
                
            </form>
        </div>
    </div>

<script src="/mainMenu/mainMenu.js"></script>
</body>
</html>
