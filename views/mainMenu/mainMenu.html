<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../public/mainMenu/mainMenu.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/Logo.png">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<title>My Shop</title>
</head>

<body>

  <!-- Top Navigation Bar -->
  <header class="navbar-container">
    <div class="user-profile">
      <button class="btn btn-outline-light" onclick="openAccountSettings()">Account settings</button>
    </div>
    <div class="search-bar-container">
      <input type="text" id="store-search" class="form-control" placeholder="Search products...">
    </div>
    <div class="nav-right">
      <h2 class="store-logo">My Shop</h2>
      <button id="open-cart-btn" class="btn btn-outline-light position-relative" onclick="toggleCart()">
        🛒 Cart
        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </button>
    </div>
  </header>

  <!-- Main Storefront -->
  <main class="store-layout">

    <aside class="sidebar-filters">
      <h3>Filters</h3>
      <div class="filter-group">
        <label for="price-range" class="form-label">Price Range</label>
        <div class="slider-wrapper">
            <span class="slider-label">0$</span>
            <input type="range" id="maxPrice" min="0" max="1000" value="500">
            <span class="slider-label">1000$</span> 
        </div>
        <div>
            <span id="priceVal" for="maxPrice">0$ - 500$</span>    
        </div>
        <br>
        <label for="discount" class="form-label">Minimum discount</label>
        <div class="slider-wrapper">
            <span class="slider-label">0%</span>
            <input type="range" id="minDiscount" min="0" max="100" value="10">
            <span class="slider-label">100%</span> 
        </div>
    <div>
        <span id="discountVal" for="minDiscount">10% - 100%</span>    
    </div>
    <br>
    </div>
      <div class="filter-group">
        <h5>Reviews</h5>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="stars5">
          <label class="form-check-label" for="stars5">5★</label> <br>
          <input class="form-check-input" type="checkbox" id="stars4">
          <label class="form-check-label" for="stars4">4★</label> <br>
          <input class="form-check-input" type="checkbox" id="stars3">
          <label class="form-check-label" for="stars3">3★</label> <br>
          <input class="form-check-input" type="checkbox" id="stars2">
          <label class="form-check-label" for="stars2">2★</label> <br>
          <input class="form-check-input" type="checkbox" id="stars1">
          <label class="form-check-label" for="stars1">1★</label> <br>
        </div>
      </div>
    </aside>

    <section class="products-container">
      <div class="product-grid" id="product-grid"></div>
      <div class="load-more-wrap">
        <button id="load-more-btn" class="btn btn-outline-light load-more-btn">Load More</button>
      </div>
    </section>

  </main>

  <!-- Cart Pop-up Overlay -->
  <div id="cart-backdrop" class="cart-backdrop" onclick="toggleCart()"></div>

  <aside id="cart-popup" class="cart-popup">
    <div class="cart-header">
      <h4>Shopping Cart</h4>
      <button type="button" class="btn-close btn-close-white" onclick="toggleCart()"></button>
    </div>
    <div class="cart-body" id="cart-body">
      <p class="text-muted" id="empty-cart-msg">Your cart is empty.</p>
      <ul id="cart-items-list" class="list-group"></ul>
    </div>
    <div class="cart-footer">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <strong>Total:</strong>
        <span id="cart-total">$0.00</span>
      </div>
      <button class="btn btn-success w-100">Checkout</button>
    </div>
  </aside>
<script src="../../public/mainMenu/mainMenu.js"></script>
</body>
</html>
