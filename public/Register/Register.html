<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"> <!--Dark theme  -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!--Import of bootstrap for nicer ui-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/Register/Register.js"></script>
  <link rel="stylesheet" href="/Register/Register.css">
  <title>Login Page</title>
</head>

<body>
  <div class="container p-3 my-5 bg-black text-white text-left" id="login-container">
    <!--Bootstrap container with black background centered white text and a custom id -->
    <img src="/Register/images/Logo.png" class="mx-auto d-block" style="max-width: 50%; max-height: 40%;">
    <!--Centered logo image -->
    <h3 id="text" style="text-align: center;"> Register to nozama </h3> <br>
    <form onsubmit="event.preventDefault(); showModal();">
      <!--form to send the info and when you submit it shows the modal and let you fill the password if the email is entered correctly-->
      <label for="fname" class="formLabel">First name</label>
      <input type="text" id="fname" class="form-control formElement" required placeholder="Enter your first name"> <br>
      <label for="lname" class="formLabel">Last name</label>
      <input type="text" id="lname" class="form-control formElement" required placeholder="Enter your last name"> <br>
      <label for="bday" class="formLabel">Birthday</label>
      <input type="date" id="bday" class="form-control formElement" required placeholder="Enter your birthday"> <br>
      <label>Gender</label> <br>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label><br>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label><br>
      <input type="radio" id="other" name="gender" value="other">
      <label for="other">Other</label> <br><br>
      <label for="mail" class="formLabel">Mail</label> <br>
      <input type="text" id="mail" class="form-control formElement" required
        placeholder="Enter your email address please"><!--email field-->
      <button onclick="validateRegister()" type="submit"
        class="btn btn-light my-4 mx-auto d-block ButtonClass">Next</button>
      <!--next button with validation of the email when you click-->
    </form>

    <p id="noAccountText"> Already have an account?</p>
    <a id="link" href="../Login/Login.html"> Go to Sign in</a>
  </div>
  <div class="modal fade" id="PasswordModal" tabindex="-1" data-bs-backdrop="static" data-bs-keybored="false">
    <!--Password modal-->
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"> <!--Header modal part-->
          <form>
            <h5 class="modal-title">Enter Password</h5> <!-- Header text -->
            <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="closeModal()"></button>
            <!--Header button-->
        </div>
        <div class="modal-body text-center">
          <!--the modal part for the password here there is use of many bootstrap classes-->
          <p id="infoDisplay" class="text-muted small mb-3"></p>

          <div class="input-group mb-3">
            <input id="passwordInput" type="password" class="form-control">
            <span class="input-group-text" onclick="toggleVisibility('passwordInput', this)">
              <i class="bi bi-eye"></i>
            </span>
          </div>

          <div class="input-group">
            <input id="passwordConfirmation" type="password" class="form-control">
            <span class="input-group-text" onclick="toggleVisibility('passwordConfirmation', this)">
              <i class="bi bi-eye"></i>
            </span>
          </div>
          </form>
          <div id="passwordError" class="error-text">Password must be at least 8 characters, have 1 letter and 1 number
            at least</div> <!--error message for the password-->
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary " onclick="nextPage()">Login</button>
            <!--moves you to the feed page-->
          </div>
        </div>
      </div>
    </div>
</body>

</html>
